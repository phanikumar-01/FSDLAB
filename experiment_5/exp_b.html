<!DOCTYPE html>
<html>
<head>
    <title>Experiment 5b - Background Image</title>
    <style>
        body { margin: 0; overflow-x: hidden; }
        .top {
            height: 500px;
            padding: 20px;

        }
        .bg {
            height: 400px;
            margin-top: 100px;
            background-image: url('assets/bg-image.jpg');
            background-size: cover;
            background-attachment: fixed;
            transform: rotate(-10deg);
        }
    </style>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <div class="top">
        <h1>Background Image</h1>
        <p>Scroll down to see the image halfway down the page.</p>
        <p>The image is tilted and stays fixed while scrolling.</p>
    </div>

    <div class="bg"></div>
</body>
</html>
