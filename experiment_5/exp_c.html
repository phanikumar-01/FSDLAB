<!DOCTYPE html>
<html>
<head>
    <title>Experiment 5c - Font and Text Properties</title>
    <style>
        .size { font-size: 30px; }
        .weight { font-weight: bold; }
        .style { font-style: italic; }
        .decoration { text-decoration: underline; }
        .transform { text-transform: uppercase; }
        .align { text-align: center; }
    </style>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Font and Text Properties</h1>

    <p class="size">font-size: 30px</p>
    <p class="weight">font-weight: bold</p>
    <p class="style">font-style: italic</p>
    <p class="decoration">text-decoration: underline</p>
    <p class="transform">text-transform: uppercase</p>
    <p class="align">text-align: center</p>
</body>
</html>
