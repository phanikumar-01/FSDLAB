<!DOCTYPE html>
<html>
<head>
    <title>Experiment 6c - JavaScript Input and Type Conversion</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Input and Type Conversion</h1>

    <input type="text" id="num" value="10">
    <button onclick="convert()">Convert</button>
    <p id="out"></p>

    <script>
        function convert() {
            let text = document.getElementById("num").value;
            let number = Number(text);
            let promptNumber = Number(prompt("Enter another number"));

            document.getElementById("out").innerHTML =
                "Input: " + text + " (type: " + typeof text + ")<br>" +
                "After Number(): " + number + " (type: " + typeof number + ")<br>" +
                "Sum: " + (number + promptNumber);
        }
    </script>
</body>
</html>
