<!DOCTYPE html>
<html>
<head>
    <title>Experiment 6d - Voter Eligibility</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Voter Eligibility</h1>
    <button onclick="check()">Check Eligibility</button>
    <div id="out"></div>

    <script>
        function check() {
            let name = prompt("Enter your name");
            let age = Number(prompt("Enter your age"));
            let result = age >= 18 ? "Can vote" : "Cannot vote";

            document.getElementById("out").innerHTML =
                "<table border='1' cellpadding='5'>" +
                "<tr><th>Name</th><th>Age</th><th>Eligibility</th></tr>" +
                "<tr><td>" + name + "</td><td>" + age + "</td><td>" + result + "</td></tr>" +
                "</table>";
        }
    </script>
</body>
</html>
