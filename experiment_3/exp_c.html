<!DOCTYPE html>
<html>
<head>
    <title>Experiment 3c - Types of CSS</title>
    <link rel="stylesheet" href="exp_c.css">
    <style>
        /* selector: .internal, property: color, value: blue */
        .internal { color: blue; }
    </style>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Types of CSS</h1>

    <!-- inline: selector: p, property: color, value: red -->
    <p style="color: red;">This is an inline style.</p>

    <!-- internal: selector: .internal, property: color, value: blue -->
    <p class="internal">This is an internal style.</p>

    <!-- external: selector: .external, property: color, value: green -->
    <p class="external">This is an external style.</p>
</body>
</html>
