<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7b - Window Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Window Object</h1>
    <button onclick="window.alert('Hello')">Alert</button>
    <button onclick="window.open('https://example.com')">Open Window</button>
    <p id="out"></p>

    <script>
        document.getElementById("out").innerHTML =
            "Width: " + window.innerWidth + "<br>" +
            "Height: " + window.innerHeight;
    </script>
</body>
</html>
