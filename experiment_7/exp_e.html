<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7e - String Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>String Object</h1>
    <p id="out"></p>

    <script>
        let text = "Hello Web Technologies";
        let out = document.getElementById("out");

        out.innerHTML = "String: " + text + "<br>";
        out.innerHTML += "Length: " + text.length + "<br>";
        out.innerHTML += "Uppercase: " + text.toUpperCase() + "<br>";
        out.innerHTML += "Lowercase: " + text.toLowerCase() + "<br>";
        out.innerHTML += "indexOf('Web'): " + text.indexOf("Web");
    </script>
</body>
</html>
