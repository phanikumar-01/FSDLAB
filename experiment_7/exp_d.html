<body>

    <h1>Math Object</h1>
    <p id="out"></p>

    <script>
        let out = document.getElementById("out");
        out.innerHTML = "PI: " + Math.PI + "<br>";
        out.innerHTML += "max(10, 20, 5): " + Math.max(10, 20, 5) + "<br>";
        out.innerHTML += "sqrt(16): " + Math.sqrt(16) + "<br>";
        out.innerHTML += "round(4.6): " + Math.round(4.6);
    </script>
</body>
