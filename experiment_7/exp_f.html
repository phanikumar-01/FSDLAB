<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7f - Regex Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Regex Object</h1>
    <p id="out"></p>

    <script>
        let out = document.getElementById("out");
        let email = "student@example.com";
        let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        out.innerHTML = "Email: " + email + "<br>";
        out.innerHTML += "test(): " + pattern.test(email) + "<br>";
        out.innerHTML += "exec(): " + pattern.exec(email);
    </script>
</body>
</html>
