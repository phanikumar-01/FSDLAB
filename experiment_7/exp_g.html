<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7g - Date Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Date Object</h1>
    <p id="out"></p>

    <script>
        let date = new Date();
        let out = document.getElementById("out");

        out.innerHTML = "Date: " + date.toDateString() + "<br>";
        out.innerHTML += "Year: " + date.getFullYear() + "<br>";
        out.innerHTML += "Month: " + (date.getMonth() + 1) + "<br>";
        out.innerHTML += "Day: " + date.getDate();
    </script>
</body>
</html>
