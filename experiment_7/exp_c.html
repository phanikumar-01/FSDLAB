<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7c - Array Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Array Object</h1>
    <p id="out"></p>

    <script>
        let fruits = ["Apple", "Mango", "Banana"];
        let out = document.getElementById("out");

        out.innerHTML = "Array: " + fruits + "<br>";
        fruits.push("Orange");
        out.innerHTML += "After push: " + fruits + "<br>";
        fruits.pop();
        out.innerHTML += "After pop: " + fruits + "<br>";
        out.innerHTML += "Length: " + fruits.length + "<br>";
        out.innerHTML += "Sorted: " + fruits.sort();
    </script>
</body>
</html>
