<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7h - User-defined Object</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>User-defined Object</h1>
    <p id="out"></p>

    <script>
        class Student {
            constructor(name, rollNo) {
                this._name = name;
                this._rollNo = rollNo;
            }

            get name() {
                return this._name;
            }

            set name(value) {
                this._name = value;
            }

            display() {
                return this._name + " (" + this._rollNo + ")";
            }
        }

        let student = new Student("Phani Kumar", "24K61A1259");
        student.name = "K H N V Phani Kumar";

        document.getElementById("out").innerHTML = student.display();
    </script>
</body>
</html>
