<!DOCTYPE html>
<html>
<head>
    <title>Experiment 9c - Form Validation</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Registration Form</h1>

    <form onsubmit="return validateForm()">
        Name: <input type="text" id="name"><br><br>
        Mobile: <input type="text" id="mobile"><br><br>
        Email: <input type="text" id="email"><br><br>
        <input type="submit" value="Submit">
    </form>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let mobile = document.getElementById("mobile").value;
            let email = document.getElementById("email").value;

            let namePattern = /^[A-Za-z][A-Za-z0-9]{5,}$/;
            let mobilePattern = /^[0-9]{10}$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!namePattern.test(name)) {
                alert("Name must start with a letter and have at least 6 characters");
                return false;
            }
            if (!mobilePattern.test(mobile)) {
                alert("Mobile number must be 10 digits");
                return false;
            }
            if (!emailPattern.test(email)) {
                alert("Enter a valid email address");
                return false;
            }

            alert("Form submitted successfully");
            return false;
        }
    </script>
</body>
</html>
