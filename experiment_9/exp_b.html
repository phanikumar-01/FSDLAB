<!DOCTYPE html>
<html>
<head>
    <title>Experiment 9b - Four Buttons</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Four Function Buttons</h1>
    <input type="text" id="value" placeholder="Enter a number or word">
    <br><br>
    <button onclick="showFactorial()">Factorial</button>
    <button onclick="showFibonacci()">Fibonacci</button>
    <button onclick="showPrime()">Prime</button>
    <button onclick="showPalindrome()">Palindrome</button>
    <p id="out"></p>

    <script>
        function factorial(n) {
            let result = 1;
            for (let i = 1; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function fibonacci(n) {
            let a = 0, b = 1, result = "";
            for (let i = 1; i <= n; i++) {
                result += a + " ";
                let c = a + b;
                a = b;
                b = c;
            }
            return result;
        }

        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function isPalindrome(text) {
            let reversed = text.split("").reverse().join("");
            return text === reversed;
        }

        function showFactorial() {
            let n = Number(document.getElementById("value").value);
            document.getElementById("out").innerHTML = "Factorial: " + factorial(n);
        }

        function showFibonacci() {
            let n = Number(document.getElementById("value").value);
            document.getElementById("out").innerHTML = "Fibonacci: " + fibonacci(n);
        }

        function showPrime() {
            let n = Number(document.getElementById("value").value);
            document.getElementById("out").innerHTML = "Prime: " + isPrime(n);
        }

        function showPalindrome() {
            let text = document.getElementById("value").value;
            document.getElementById("out").innerHTML = "Palindrome: " + isPalindrome(text);
        }
    </script>
</body>
</html>
