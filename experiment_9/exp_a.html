<!DOCTYPE html>
<html>
<head>
    <title>Experiment 9a - Functions</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Functions</h1>
    <input type="text" id="value" placeholder="Enter a number or word">
    <button onclick="showAll()">Show All</button>
    <p id="out"></p>

    <script>
        function factorial(n) {
            let result = 1;
            for (let i = 1; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function fibonacci(n) {
            let a = 0, b = 1, result = "";
            for (let i = 1; i <= n; i++) {
                result += a + " ";
                let c = a + b;
                a = b;
                b = c;
            }
            return result;
        }

        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function isPalindrome(text) {
            let reversed = text.split("").reverse().join("");
            return text === reversed;
        }

        function showAll() {
            let value = document.getElementById("value").value;
            let n = Number(value);

            if (isNaN(n)) {
                document.getElementById("out").innerHTML = "Palindrome: " + isPalindrome(value);
                return;
            }

            document.getElementById("out").innerHTML =
                "Factorial: " + factorial(n) + "<br>" +
                "Fibonacci: " + fibonacci(n) + "<br>" +
                "Prime: " + isPrime(n) + "<br>" +
                "Palindrome: " + isPalindrome(value);
        }
    </script>
</body>
</html>
