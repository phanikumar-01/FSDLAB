<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8e - Armstrong Number</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Armstrong Number</h1>
    <button onclick="checkArmstrong()">Enter Number</button>

    <script>
        function checkArmstrong() {
            let number = Number(prompt("Enter a number"));
            let temp = number;
            let sum = 0;

            while (temp > 0) {
                let digit = temp % 10;
                sum += digit * digit * digit;
                temp = Math.floor(temp / 10);
            }

            if (sum === number) {
                alert(number + " is an Armstrong number");
            } else {
                alert(number + " is not an Armstrong number");
            }
        }
    </script>
</body>
</html>
