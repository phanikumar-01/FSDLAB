<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8d - Object Loops</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Object Loops</h1>

    <h3>for-in</h3>
    <p id="forin"></p>

    <h3>forEach</h3>
    <p id="foreach"></p>

    <h3>for-of</h3>
    <p id="forof"></p>

    <script>
        let student = {
            name: "Phani Kumar",
            rollNo: "24K61A1259",
            course: "Web Technologies"
        };

        let forInText = "";
        for (let key in student) {
            forInText += key + ": " + student[key] + "<br>";
        }
        document.getElementById("forin").innerHTML = forInText;

        let forEachText = "";
        Object.keys(student).forEach(function (key) {
            forEachText += key + ": " + student[key] + "<br>";
        });
        document.getElementById("foreach").innerHTML = forEachText;

        let forOfText = "";
        for (let key of Object.keys(student)) {
            forOfText += key + ": " + student[key] + "<br>";
        }
        document.getElementById("forof").innerHTML = forOfText;
    </script>
</body>
</html>
