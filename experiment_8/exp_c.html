<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8c - Loops 1 to 10</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Print 1 to 10</h1>

    <h3>for loop</h3>
    <p id="for"></p>

    <h3>while loop</h3>
    <p id="while"></p>

    <h3>do-while loop</h3>
    <p id="dowhile"></p>

    <script>
        let forText = "";
        for (let i = 1; i <= 10; i++) {
            forText += i + " ";
        }
        document.getElementById("for").innerHTML = forText;

        let j = 1;
        let whileText = "";
        while (j <= 10) {
            whileText += j + " ";
            j++;
        }
        document.getElementById("while").innerHTML = whileText;

        let k = 1;
        let doText = "";
        do {
            doText += k + " ";
            k++;
        } while (k <= 10);
        document.getElementById("dowhile").innerHTML = doText;
    </script>
</body>
</html>
