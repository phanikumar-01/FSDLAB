<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8b - Days of the Week</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Days of the Week</h1>
    <button onclick="showDay()">Enter Day Number</button>

    <script>
        function showDay() {
            let day = Number(prompt("Enter a number from 1 to 7"));

            switch (day) {
                case 1: alert("Sunday"); break;
                case 2: alert("Monday"); break;
                case 3: alert("Tuesday"); break;
                case 4: alert("Wednesday"); break;
                case 5: alert("Thursday"); break;
                case 6: alert("Friday"); break;
                case 7: alert("Saturday"); break;
                default: alert("Invalid day");
            }
        }
    </script>
</body>
</html>
