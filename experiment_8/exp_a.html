    <title>Experiment 8a - Largest of Three Numbers</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Largest of Three Numbers</h1>
    <button onclick="findLargest()">Enter Numbers</button>

    <script>
        function findLargest() {
            let a = Number(prompt("Enter first number"));
            let b = Number(prompt("Enter second number"));
            let c = Number(prompt("Enter third number"));

            if (a === b && b === c) {
                alert("All numbers are equal");
            } else if (a >= b && a >= c) {
                alert(a + " is the largest");
            } else if (b >= a && b >= c) {
                alert(b + " is the largest");
            } else {
                alert(c + " is the largest");
            }
        }
    </script>
</body>
</html>
