<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8f - Denomination Breakdown</title>
</head>
<body>
    <p>K H N V Phani Kumar<br>24K61A1259</p>

    <h1>Denomination Breakdown</h1>
    <button onclick="breakdown()">Enter Amount</button>
    <p id="out"></p>

    <script>
        function breakdown() {
            let amount = Number(prompt("Enter the amount"));
            let notes = [100, 50, 20, 10, 5, 2, 1];
            let out = "";

            for (let i = 0; i < notes.length; i++) {
                let count = Math.floor(amount / notes[i]);
                if (count > 0) {
                    out += count + " x " + notes[i] + "<br>";
                    amount = amount % notes[i];
                }
            }

            document.getElementById("out").innerHTML = out;
        }
    </script>
</body>
</html>
