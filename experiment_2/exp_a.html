<!DOCTYPE html>
<html>
<head>
    <title>Experiment 2a - Tables</title>
</head>
<body>

    <h1>Student Table</h1>

    <table border="1" cellpadding="5">
        <tr>
            <th colspan="3">Student Information</th>
        </tr>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>John</td>
            <td>20</td>
            <td rowspan="2">A</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>21</td>
        </tr>
    </table>
</body>
